spring.application.name=airport-lost-found-api

server.port=${PORT:8085}

# Support deployment behind reverse proxies (Render, Railway, Cloudflare, AWS, Nginx)
server.forward-headers-strategy=framework

# Cookie settings for cross-origin and production support
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/airport_lost_found}
spring.datasource.username=${DB_USERNAME:airport_app}
spring.datasource.password=${DB_PASSWORD:shivam123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Do not let Spring Boot create or modify our schema.
spring.sql.init.mode=never

# Multipart file upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

